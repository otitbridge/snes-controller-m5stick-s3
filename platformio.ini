[env:m5stack-sticks3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=5
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DWEBSOCKETS_SERVER_CLIENT_MAX=2
    -DWEBSOCKETS_TCP_TIMEOUT=100
lib_deps =
    M5Unified=https://github.com/m5stack/M5Unified#fd40d58b8405ad1e7ed7afab548dab5e7cec5bbb
    M5PM1=https://github.com/m5stack/M5PM1#be9a5456c007c333e7ac963f33bfde1ffa5d82ee
    links2004/WebSockets@2.7.2
